name: Update Hanoi draws

on:
  schedule:
    # เวลาเป็น UTC (ไทย = UTC+7) — หวยฮานอยปกติออกทุกวัน ~18:30 น. เวลาไทย (= 11:30 UTC)
    # รอบตั้งแต่ 12:00 น. จะ "เฝ้ารอผล" อยู่จนผลออก (GitHub มักเลื่อน/ข้ามรอบช่วงค่ำ จึงเผื่อหลายรอบ)
    - cron: "10 5 * * *"       # 12:10 น. ล็อกชุดลุ้น + เฝ้ารอผล
    - cron: "50 6 * * *"       # 13:50 น.
    - cron: "40 7 * * *"       # 14:40 น.
    - cron: "20 9 * * *"       # 16:20 น.
    - cron: "30 10 * * *"      # 17:30 น.
    - cron: "40,55 11 * * *"   # 18:40 และ 18:55 น.
    - cron: "15,45 12 * * *"   # 19:15 และ 19:45 น.
    - cron: "30 13 * * *"      # 20:30 น.
    - cron: "20 3 * * *"       # 10:20 น. ล็อกชุดลุ้น (สำรอง)
    - cron: "10 1 * * *"       # สำรองเช้าวันถัดไป 08:10 น.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-draws
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340  # รอบที่เฝ้ารอผลอาจรันนานหลายชั่วโมง (ฟรีสำหรับ repo สาธารณะ)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Self-test parser
        run: node scripts/update-draws.mjs --test
      - name: Fetch latest Hanoi results
        run: node scripts/update-draws.mjs
      - name: Lock numbers for the next draw (ชุดลุ้น)
        run: node scripts/lock-picks.mjs
      - name: Commit new draws / locked numbers
        run: bash scripts/commit-data.sh "Add new Hanoi draws / lock numbers"
      - name: Watch for today's result (เฝ้ารอผลวันนี้)
        env:
          WATCH_FROM: "13"
          WATCH_UNTIL: "21.5"
          WATCH_DAYS: "0-6"
        run: node scripts/watch-draw.mjs
      - name: Lock next draw + commit again
        run: |
          node scripts/lock-picks.mjs
          bash scripts/commit-data.sh "Add new Hanoi draws / lock numbers"
